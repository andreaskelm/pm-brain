name: Evals

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  repo-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r system/evals/requirements.txt
      - name: L0 — links, encoding, scenario consistency
        run: python system/evals/checks/verify-markdown.py
      - name: L4 — write-gate hook unit tests
        run: python system/evals/harness/checks/test_hook_validator.py
