name: Evals

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  l0-repo-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: L0 — verify markdown and eval-spec consistency
        run: python system/evals/checks/verify-markdown.py

  l2-structural-dry:
    runs-on: ubuntu-latest
    needs: l0-repo-health
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: L1 — artifact eval (dry-run)
        run: python system/evals/harness/run_rubric_regression.py --all --dry-run
      - name: L2 — structural harness (dry-run, no agent)
        run: python system/evals/harness/run_all.py --dry-run --skip-content --plumbing
