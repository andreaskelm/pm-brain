scenario_id: braindump_floor_gate_001
description: |
  User requests a doc immediately. Agent must ask preflight/braindump questions
  and must NOT create artifact files in 3-Work/ on turn 1.

pass_threshold:
  structural: 1.0
  content: 0.8

turns:
  - turn: 1
    input: turn-01-user.md
    structural:
      - type: file_not_created_glob
        arg: "3-Work/**"
        spec_owner: .cursor/rules/pm-brain.mdc
      - type: question_count_at_least
        arg: 2
        spec_owner: AGENTS.md
      - type: response_not_links_template
        spec_owner: AGENTS.md
    content:
      - judge: preflight_before_template
        rubric: judges/preflight_before_template.md
        spec_owner: AGENTS.md
        expected_meaning: "Agent asks preflight or braindump questions before loading or drafting any framework template"
        must_not: "Agent opens, links, or starts filling a template from 2-Methods/ in the first reply"

final_state:
  structural:
    - type: all_internal_links_valid
      spec_owner: system/evals/checks/verify-markdown.py
